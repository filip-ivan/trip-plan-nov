    function el(html) {
      const t = document.createElement("template");
      t.innerHTML = html.trim();
      return t.content;
    }

    function allOptions() {
      return SHORT_OPTIONS.concat(VARIANT_OPTIONS);
    }

    function gmapsNav(dest) {
      return `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(dest)}`;
    }

    function mapLink(dest) {
      if (!dest) return "";
      return ` <a class="map-link" href="${gmapsNav(dest)}" target="_blank" rel="noopener">Map</a>`;
    }

    function stayBits(s) {
      const year = s.year ? ` · ${s.year}` : "";
      const note = s.note ? ` · ${s.note}` : "";
      const live = s.status === "live-check" ? " live" : "";
      const label = s.book || (s.status === "live-check" ? "Check price" : "Book");
      return `${s.night}: ${s.name}${mapLink(s.dest)} · ${s.rating}${year} · ${s.feel}${note} · <a class="book${live}" href="${s.href}" target="_blank" rel="noopener">${label}</a>`;
    }

    function choiceBits(c) {
      const tripClass = c.over ? "over" : "under";
      const tag = c.tag ? ` · <span class="tag">${c.tag}</span>` : "";
      const rating = c.rating ? `${c.rating} · ` : "";
      const feel = c.feel ? `${c.feel} · ` : "";
      const eve = c.evening ? ` — <span class="eve">${c.evening}</span>` : "";
      return `${c.name}${mapLink(c.dest)} · <a class="book" href="${c.href}" target="_blank" rel="noopener">Book</a> · ${rating}${feel}${c.price} · <span class="${tripClass}">${c.trip}</span>${tag}${eve}`;
    }

    function optionCardHTML(o) {
      const meta = OPTION_SLEEPS[o.id];
      const leave = meta.leaveMap
        ? meta.leave.replace("Sherman’s breakfast", `Sherman’s breakfast${mapLink(meta.leaveMap)}`)
        : meta.leave;
      let stays;
      if (meta.tonightChoices) {
        const label = `<p class="chooser-label">${meta.chooserLabel}</p>`;
        const choices = meta.tonightChoices.map((c) => `<p class="choice">${choiceBits(c)}</p>`).join("");
        const cheaper = meta.cheaperChoices
          ? `<p class="chooser-label">${meta.cheaperLabel}</p>` + meta.cheaperChoices.map((c) => `<p class="choice">${choiceBits(c)}</p>`).join("")
          : "";
        const thu = (meta.sleeps || []).map((s) => `<p class="stay-line">${stayBits(s)}</p>`).join("");
        stays = label + choices + cheaper + thu;
      } else {
        stays = (meta.sleeps || []).map((s) => `<p class="stay-line">${stayBits(s)}</p>`).join("");
      }
      const places = (meta.places || []).map((p) => {
        if (typeof p === "string") return `<p class="place-item">${p}</p>`;
        return `<p class="place-item">${p.name}${mapLink(p.dest)} — ${p.blurb}</p>`;
      }).join("");
      const tide = meta.tide ? `<p class="tide">${meta.tide}</p>` : "";
      const altLinks = (meta.alts || []).map((a) => `<a href="${a.href}" target="_blank" rel="noopener">${a.name}</a>${mapLink(a.dest)}`).join(" · ");
      const alts = altLinks ? `<p class="alts">Also: ${altLinks}</p>` : "";
      return `<h3>${o.name} <span class="total">${o.total}</span></h3>
          <p class="leave">${leave}</p>
          ${stays}
          ${places}
          ${tide}
          ${alts}
          <p class="card-foot"><a class="details-link" href="#opt-${o.id}">Details</a></p>`;
    }

    function renderDecision() {
      const root = document.getElementById("option-cards");
      root.innerHTML = "";
      allOptions().forEach((o) => {
        const card = document.createElement("article");
        card.className = "card" + (o.pick ? " pick" : "");
        card.innerHTML = optionCardHTML(o);
        root.appendChild(card);
      });
      root.querySelectorAll(".details-link").forEach((a) => {
        a.addEventListener("click", (e) => {
          const id = a.getAttribute("href").slice(1);
          const d = document.getElementById(id);
          if (!d) return;
          e.preventDefault();
          d.open = true;
          d.scrollIntoView({ behavior: "smooth", block: "start" });
        });
      });
    }

    const ROUTES = {};

    function wxCodeText(code) {
      const n = Number(code);
      if (n === 0) return "Clear";
      if (n <= 3) return "Partly cloudy";
      if (n === 45 || n === 48) return "Fog";
      if (n <= 57) return "Drizzle";
      if (n <= 67) return "Rain";
      if (n <= 77) return "Snow";
      if (n <= 82) return "Rain showers";
      if (n <= 86) return "Snow showers";
      if (n <= 99) return "Thunderstorms";
      return "Mixed conditions";
    }

    function formatPT(date = new Date()) {
      return date.toLocaleString("en-US", {
        timeZone: "America/Los_Angeles",
        weekday: "short",
        month: "short",
        day: "numeric",
        year: "numeric",
        hour: "numeric",
        minute: "2-digit",
        second: "2-digit"
      }) + " PT";
    }

    function forecastGovUrl(stop) {
      return `https://forecast.weather.gov/MapClick.php?lat=${stop.lat}&lon=${stop.lon}`;
    }

    function fetchTimeout(url, opts = {}, ms = 10000) {
      const ctrl = new AbortController();
      const t = setTimeout(() => ctrl.abort(), ms);
      return fetch(url, { ...opts, signal: ctrl.signal }).finally(() => clearTimeout(t));
    }

      return document.getElementById("wx-" + stop.id);

      div.innerHTML = `<h4>${stop.name}</h4>
        <div class="when">${stop.when} · ${stop.date}</div>
        <p class="pending">Getting the forecast…</p>`;
      return div;
    }

    function fToC(f) {
      return Math.round((Number(f) - 32) * 5 / 9);
    }

    function formatTemp(f) {
      if (f == null || Number.isNaN(Number(f))) return "";
      const n = Math.round(Number(f));
      return `${n}°F / ${fToC(n)}°C`;
    }

    function renderWxSuccess(stop, data) {
      const el = cardEl(stop);
      if (!el) return;
      const high = formatTemp(data.high);
      const low = data.low != null ? formatTemp(data.low) : "";
      const range = low
        ? `<span>High ${high}</span><span>Low ${low}</span>`
        : `<span>${high}</span>`;
      const alerts = (data.alerts || []).map((a) => `<div class="alert-flag">${a}</div>`).join("");
      const alertNote = data.alertsUnavailable
        ? `<p class="fallback"><a href="https://www.weather.gov/" target="_blank" rel="noopener">Alerts unavailable, check weather.gov</a></p>`
        : "";
      el.innerHTML = `<h4>${stop.name}</h4>
        <div class="when">${stop.when} · ${stop.date}</div>
        <p class="temps">${range}</p>
        <p>${data.conditions}${data.wind ? `<br>${data.wind}` : ""}</p>
        <p class="when">Source: ${data.source}</p>
        ${alerts}
        ${alertNote}`;
    }

    function renderWxError(stop) {
      const el = cardEl(stop);
      if (!el) return;
      el.innerHTML = `<h4>${stop.name}</h4>
        <div class="when">${stop.when} · ${stop.date}</div>
        <p class="err">Couldn't load the forecast for this stop.</p>
        <p class="fallback"><a href="${forecastGovUrl(stop)}" target="_blank" rel="noopener">Open the National Weather Service forecast for ${stop.name}</a></p>`;
    }

    async function openMeteoForStop(stop) {
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${stop.lat}&longitude=${stop.lon}&daily=temperature_2m_max,temperature_2m_min,weathercode,wind_speed_10m_max,wind_gusts_10m_max,precipitation_probability_max&temperature_unit=fahrenheit&wind_speed_unit=mph&timezone=America/Los_Angeles&start_date=${stop.date}&end_date=${stop.date}`;
      const r = await fetchTimeout(url, {}, 10000);
      if (!r.ok) throw new Error("open-meteo " + r.status);
      const d = await r.json();
      if (!d.daily || !d.daily.temperature_2m_max || d.daily.temperature_2m_max[0] == null) {
        throw new Error("open-meteo empty");
      }
      const pop = d.daily.precipitation_probability_max ? d.daily.precipitation_probability_max[0] : null;
      const gust = d.daily.wind_gusts_10m_max ? d.daily.wind_gusts_10m_max[0] : null;
      const wind = d.daily.wind_speed_10m_max ? d.daily.wind_speed_10m_max[0] : null;
      let windText = "";
      if (wind != null) windText = `Wind ${Math.round(wind)} mph`;
      if (gust != null) windText += (windText ? `, gusts ${Math.round(gust)} mph` : `Gusts ${Math.round(gust)} mph`);
      let conditions = wxCodeText(d.daily.weathercode[0]);
      if (pop != null) conditions += `, ${pop}% chance of precip`;
      return {
        source: "Open-Meteo",
        high: Math.round(d.daily.temperature_2m_max[0]),
        low: Math.round(d.daily.temperature_2m_min[0]),
        unit: "F",
        wind: windText,
        conditions,
        alerts: [],
        alertsUnavailable: false
      };
    }

    async function nwsAlertsForStop(stop) {
      const url = `https://api.weather.gov/alerts/active?point=${stop.lat},${stop.lon}`;
      const r = await fetchTimeout(url, { headers: { Accept: "application/geo+json" } }, 8000);
      if (!r.ok) throw new Error("alerts " + r.status);
      const aj = await r.json();
      return (aj.features || []).map((f) => {
        const p = f.properties || {};
        return p.event || p.headline || "Active alert";
      });
    }

    async function fillStop(stop) {
      try {
        const data = await openMeteoForStop(stop);
        try {
          data.alerts = await nwsAlertsForStop(stop);
        } catch (e) {
          data.alertsUnavailable = true;
        }
        renderWxSuccess(stop, data);
        return true;
      } catch (e) {
        renderWxError(stop);
        return false;
      }
    }

    function syncOptionWeather() {
      document.querySelectorAll(".opt-wx").forEach((box) => {
        const ids = (box.getAttribute("data-stops") || "").split(",").filter(Boolean);
        box.innerHTML = ids.map((id) => {
          const src = document.getElementById("wx-" + id);
          if (!src) return "";
          const copy = src.cloneNode(true);
          copy.removeAttribute("id");
          const wrap = document.createElement("div");
          wrap.appendChild(copy);
          return wrap.innerHTML;
        }).join("");
      });
      const stamp = document.getElementById("wx-updated");
      if (stamp) {
        document.querySelectorAll(".wx-updated").forEach((el) => {
          el.textContent = stamp.textContent;
        });
      }
    }

    async function loadWeather() {
      const btn = document.getElementById("refresh-wx");
      const stamp = document.getElementById("wx-updated");
      const grid = document.getElementById("weather-grid");
      const btns = document.querySelectorAll(".refresh-wx, #refresh-wx");
      btns.forEach((b) => { b.disabled = true; });
      if (stamp) stamp.textContent = "Updating…";
      document.querySelectorAll(".wx-updated").forEach((el) => { el.textContent = "Updating…"; });
      grid.innerHTML = "";
      WX_STOPS.forEach((stop) => grid.appendChild(renderWxPlaceholder(stop)));
      const results = await Promise.all(WX_STOPS.map((stop) => fillStop(stop)));
      const ok = results.filter(Boolean).length;
      if (stamp) stamp.textContent = ok ? ("Last updated " + formatPT()) : ("Couldn't update forecasts · " + formatPT());
      btns.forEach((b) => { b.disabled = false; });
      syncOptionWeather();
    }

    const maps = {};

    function mapId(optionId, dayIndex) {
      return `map-${optionId}-${dayIndex}`;
    }

    function routeId(optionId, dayIndex) {
      return `${optionId}-${dayIndex}`;
    }

    function drawPrecomputed(map, id) {
      const pts = ROUTES[id];
      if (!pts || !pts.length) return null;
      const line = L.polyline(pts, { color: "#7a2e1f", weight: 4 }).addTo(map);
      map._fitLayer = line;
      map.fitBounds(line.getBounds(), { padding: [24, 24] });
      return line;
    }

    async function tryOsrm(map, day, id) {
      const pts = [day.originLL];
      if (day.via) pts.push(day.via[0]);
      pts.push(day.destLL);
      const coord = pts.map((p) => `${p[0]},${p[1]}`).join(";");
      const r = await fetchTimeout(`https://router.project-osrm.org/route/v1/driving/${coord}?overview=full&geometries=geojson`, {}, 5000);
      if (!r.ok) throw new Error("osrm");
      const j = await r.json();
      const geo = j.routes && j.routes[0] && j.routes[0].geometry;
      if (!geo) throw new Error("osrm empty");
      const latlngs = geo.coordinates.map((c) => [c[1], c[0]]);
      if (map._fitLayer) map.removeLayer(map._fitLayer);
      const line = L.polyline(latlngs, { color: "#7a2e1f", weight: 4 }).addTo(map);
      map._fitLayer = line;
      map.fitBounds(line.getBounds(), { padding: [24, 24] });
    }

    function initMap(optionId, dayIndex, day) {
      const id = mapId(optionId, dayIndex);
      const node = document.getElementById(id);
      if (!node) return;
      if (!window.L) {
        node.innerHTML = `<div class="map-fallback">The map couldn't load. Use the Google Maps link below.</div>`;
        return;
      }
      if (maps[id]) {
        setTimeout(() => {
          maps[id].invalidateSize();
          if (maps[id]._fitLayer) maps[id].fitBounds(maps[id]._fitLayer.getBounds(), { padding: [24, 24] });
        }, 80);
        return;
      }
      const map = L.map(id, { scrollWheelZoom: false });
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 18,
        attribution: "&copy; OpenStreetMap"
      }).addTo(map);
      const rid = routeId(optionId, dayIndex);
      const pre = drawPrecomputed(map, rid);
      if (!pre) {
        map.setView([day.originLL[1], day.originLL[0]], 7);
        const b = L.latLngBounds([[day.originLL[1], day.originLL[0]], [day.destLL[1], day.destLL[0]]]);
        map.fitBounds(b, { padding: [24, 24] });
      }
      L.marker([day.originLL[1], day.originLL[0]]).addTo(map).bindPopup("Start");
      L.marker([day.destLL[1], day.destLL[0]]).addTo(map).bindPopup("End");
      if (day.via) L.marker([day.via[0][1], day.via[0][0]]).addTo(map).bindPopup(day.via[1] || "Stop");
      maps[id] = map;
      tryOsrm(map, day, rid).catch(() => {});
    }

    function factRow(label, value) {
      return `<dt>${label}</dt><dd>${value}</dd>`;
    }

    function renderStay(s) {
      const role = s.role === "primary" ? `<span class="stay-role">Primary pick</span>` :
        s.role === "alternative" ? `<span class="stay-role alt">Expedia alternative</span>` :
        s.role === "secondary" ? `<span class="stay-role alt">Hotel site</span>` :
        s.role === "airbnb" ? `<span class="stay-role alt">Also on Airbnb</span>` :
        s.role === "backup" ? `<span class="stay-role alt">Backup</span>` :
        s.role === "note" ? `<span class="stay-role alt">Note</span>` : "";
      const link = s.href ? `<a href="${s.href}" target="_blank" rel="noopener">${s.name}</a>` : `<strong>${s.name}</strong>`;
      const safety = s.safety ? `<span class="safety">${s.safety}</span>` : "";
      return `<p class="stay-item">${role}${link} — ${s.detail}${safety}</p>`;
    }

    function renderCostBox(o) {
      return `<div class="cost-box">
        <p class="total">${o.total}</p>
        <p class="total-note">${o.altTotal}</p>
        <dl class="facts">${o.costLines.map((c) => factRow(c[0], c[1])).join("")}</dl>
        <p class="cost-assumptions">${COST_ASSUMPTIONS}</p>
      </div>`;
    }

    function renderDay(optionId, day, idx) {
      const dirHref = GMAPS_DIR(day.origin, day.dest);
      const mid = mapId(optionId, idx);
      const evening = day.evening ? `
        <div class="stay">
          <h3>Evening for the two of you</h3>
          <dl class="facts">
            ${factRow("Where", `${day.evening.name}. ${day.evening.detail}`)}
            ${factRow("Hours", day.evening.hours)}
            ${factRow("Price", day.evening.price)}
            ${factRow("Reservations", day.evening.reservations)}
          </dl>
          <div class="links">
            <a href="${GMAPS_PLACE(day.evening.map)}" target="_blank" rel="noopener">Open ${day.evening.name} in Google Maps</a>
            ${day.evening.site ? `<a href="${day.evening.site}" target="_blank" rel="noopener">${day.evening.name} site</a>` : ""}
          </div>
        </div>` : "";
      const meals = (day.meals && day.meals.length) ? `
        <div class="stay">
          <h3>Family meals</h3>
          ${day.meals.map((m) => `
          <dl class="facts">
            ${factRow(m.kind, `${m.name}. ${m.detail}`)}
            ${factRow("Hours", m.hours)}
          </dl>
          <div class="links">
            <a href="${GMAPS_PLACE(m.map)}" target="_blank" rel="noopener">Open ${m.name} in Google Maps</a>
            ${m.site ? `<a href="${m.site}" target="_blank" rel="noopener">${m.name} site</a>` : ""}
          </div>`).join("")}
        </div>` : "";
      const stays = day.stays ? `
        <div class="stay">
          <h3>Where to stay</h3>
          <p>${day.stayTitle}</p>
          ${day.stays.map((s) => renderStay(s)).join("")}
        </div>` : "";
      const placeLinks = (day.places || []).map((p) =>
        `<a href="${GMAPS_PLACE(p.q)}" target="_blank" rel="noopener">${p.label}</a>`
      ).join("");
      const extraDir = day.dest2 ? `<a href="${GMAPS_DIR(day.dest, day.dest2)}" target="_blank" rel="noopener">Open the second leg in Google Maps</a>` : "";
      return `<section class="day">
        <h3>${day.title}</h3>
        ${day.vibe ? `<p class="vibe">${day.vibe}</p>` : ""}
        <dl class="facts">${day.facts.map((f) => factRow(f[0], f[1])).join("")}</dl>
        <div class="map" id="${mid}"></div>
        <div class="links">
          <a href="${dirHref}" target="_blank" rel="noopener">Open this day’s drive in Google Maps</a>
          ${extraDir}
          ${placeLinks}
          ${day.museumLink ? `<a href="${day.museumLink.href}" target="_blank" rel="noopener">${day.museumLink.label}</a>` : ""}
        </div>
        ${meals}
        ${evening}
        ${stays}
      </section>`;
    }

    function renderDetailDays(id) {
      const meta = OPTION_SLEEPS[id] || {};
      const note = meta.detailNote ? `<p class="detail-note">${meta.detailNote}</p>` : "";
      return note + (DETAIL_DAYS[id] || []).map((d) => `
        <div class="day-block">
          <h3>${d.title}</h3>
          <ul>
            <li><span>Drive</span> ${d.drive}</li>
            <li><span>Daytime</span> ${d.activity}</li>
            <li><span>Dinner + bar</span> ${d.evening}</li>
            <li><span>Parking / safety</span> ${d.safety}</li>
          </ul>
        </div>`).join("");
    }

    function renderItineraries() {
      const root = document.getElementById("option-details");
      root.innerHTML = allOptions().map((o) => {
        return `<details class="opt-details" id="opt-${o.id}">
          <summary>${o.name} · ${o.total}</summary>
          ${renderDetailDays(o.id)}
        </details>`;
      }).join("");
    }

    renderDecision();
    renderItineraries();
    document.getElementById("refresh-wx").addEventListener("click", loadWeather);
    loadWeather();
  </script>
</body>
</html>
